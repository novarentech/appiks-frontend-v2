events {
  worker_connections 1024;
}

http {
  upstream auth       { server auth:3000; }
  upstream landing    { server landing:4321; }
  upstream student    { server student:3001; }
  upstream school     { server school:3002; }
  upstream psychologist { server psychologist:3003; }
  upstream superadmin { server superadmin:3004; }

  # ── appiks.id (landing) ────────────────────────────────────────
  server {
    listen 80;
    server_name appiks.id www.appiks.id;
    location / { proxy_pass http://landing; }
  }

  # ── auth.appiks.id ─────────────────────────────────────────────
  server {
    listen 80;
    server_name auth.appiks.id;
    location / {
      proxy_pass http://auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── app.appiks.id (student) ────────────────────────────────────
  server {
    listen 80;
    server_name app.appiks.id;
    location / {
      proxy_pass http://student;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── school.appiks.id ───────────────────────────────────────────
  server {
    listen 80;
    server_name school.appiks.id;
    location / {
      proxy_pass http://school;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── psikolog.appiks.id ─────────────────────────────────────────
  server {
    listen 80;
    server_name psikolog.appiks.id;
    location / {
      proxy_pass http://psychologist;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── super.appiks.id ────────────────────────────────────────────
  server {
    listen 80;
    server_name super.appiks.id;
    location / {
      proxy_pass http://superadmin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
