services:
  auth:
    build:
      context: ./apps/auth
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: ./apps/auth/.env
    restart: unless-stopped

  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    restart: unless-stopped

  student:
    build:
      context: ./apps/student
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: ./apps/student/.env
    restart: unless-stopped

  school:
    build:
      context: ./apps/school
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file: ./apps/school/.env
    restart: unless-stopped

  psychologist:
    build:
      context: ./apps/psychologist
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    env_file: ./apps/psychologist/.env
    restart: unless-stopped

  superadmin:
    build:
      context: ./apps/superadmin
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    env_file: ./apps/superadmin/.env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth
      - landing
      - student
      - school
      - psychologist
      - superadmin
    restart: unless-stopped
